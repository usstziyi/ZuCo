[project]
name = "zuco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "007", email = "007lookworld@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.1",
    "braindecode[hub,moabb]>=1.7.0",
    "datasets>=5.0.1",
    "lightning>=2.6.5",
    "mne>=1.12.1",
    "peft>=0.20.0",
    "rich>=15.0.0",
    "torch>=2.13.0",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.9.0",
    "torchview>=0.2.7",
    "torchvision>=0.28.0",
    "transformers>=5.15.1",
]

[project.scripts]
zuco = "zuco:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
